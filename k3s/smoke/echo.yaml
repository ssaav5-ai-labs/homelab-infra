apiVersion: v1
kind: Namespace
metadata:
  name: smoke
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: whoami
  namespace: smoke
spec:
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: smoke
spec:
  selector:
    app: whoami
  ports:
    - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-headless
  namespace: smoke
spec:
  clusterIP: None
  selector:
    app: whoami
  ports:
    - port: 80