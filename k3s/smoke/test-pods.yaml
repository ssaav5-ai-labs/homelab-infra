apiVersion: v1
kind: Pod
metadata:
  name: dns-k3s-01
  namespace: smoke
spec:
  nodeName: k3s-01
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.38.0
      command: ["sh", "/scripts/check.sh"]
      volumeMounts:
        - name: script
          mountPath: /scripts
  volumes:
    - name: script
      configMap:
        name: smoke-script
---
